name: evals

# Manual only: evals call the model and cost money. Run from the Actions tab
# before a release that changes how the pipeline behaves.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Run only cases with this tag (smoke, ticket, pipeline, security). Empty = all."
        required: false
        default: ""
      max_cost_usd:
        description: "Cost ceiling for the run (list-price estimate)"
        required: false
        default: "15"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code CLI and the Bash sandbox prerequisites
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.286
          sudo apt-get update -q && sudo apt-get install -yq bubblewrap socat

      - name: Run evals
        working-directory: plugins/sdd
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAG: ${{ inputs.tag }}
          MAX_COST: ${{ inputs.max_cost_usd }}
        run: |
          args=(. --trust-plugin --scaffold --ablation none --no-publish
                --model claude-sonnet-5 --judge-model claude-haiku-4-5
                --max-cost-usd "$MAX_COST" --json results.json
                --allow-tools Write "Bash(pwd)" "Bash(mkdir *)" "Bash(ls *)" "Bash(git *)" "Bash(npm test*)" "Bash(node *)")
          if [ -n "$TAG" ]; then args=(. --tag "$TAG" "${args[@]:1}"); fi
          claude plugin eval "${args[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: plugins/sdd/results.json
          if-no-files-found: ignore
